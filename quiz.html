<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take the Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Web Technologies Quiz</h1>
        <p>Test what you know!!</p>

        <form id="quizForm">
            <label for="name">Enter your name:</label>
            <input type="text" id="name" name="name" required>

            <h2>Questions</h2>

            <fieldset>
                <legend>1. What does HTML stand for?</legend>

                <label>
                    <input type="radio" name="q1" value="A" required>
                    Hyper Text Markup Language
                </label>

                <label>
                    <input type="radio" name="q1" value="B">
                    High Text Makeup Language
                </label>

                <label>
                    <input type="radio" name="q1" value="C">
                    Hyperlink Text Managment Language
                </label>

                <label>
                    <input type="radio" name="q1" value="D">
                    Hyper Text Machine Language
                </label>
            </fieldset>

            <fieldset>
                <legend>2. What is CSS mainly used for?</legend>

                <label>
                    <input type="radio" name="q2" value="A" required>
                    Styling a webpage
                </label>

                <label>
                    <input type="radio" name="q2" value="B">
                    Creating a database
                </label>

                <label>
                    <input type="radio" name="q2" value="C">
                    Storing data
                </label>

                <label>
                    <input type="radio" name="q2" value="D">
                    Accessibility functions
                </label>
            </fieldset>

            <fieldset>
                <legend>3. Which HTML tag is used to create a hyperlink?</legend>

                <label>
                    <input type="radio" name="q3" value="A" required>
                    link
                </label>

                <label>
                    <input type="radio" name="q3" value="B">
                    a
                </label>

                <label>
                    <input type="radio" name="q3" value="C">
                    href
                </label>

                <label>
                    <input type="radio" name="q3" value="D">
                    url
                </label>
            </fieldset>

            <fieldset>
                <legend>4. Which CSS property changes the text color?</legend>

                <label>
                    <input type="radio" name="q4" value="A" required>
                    background-color
                </label>

                <label>
                    <input type="radio" name="q4" value="B">
                    font-style
                </label>

                <label>
                    <input type="radio" name="q4" value="C">
                    text-align
                </label>

                <label>
                    <input type="radio" name="q4" value="D">
                    color
                </label>
            </fieldset>

            <fieldset>
                <legend>5. Which Javascript keyword declares a variable that can be reassigned?</legend>

                <label>
                    <input type="radio" name="q5" value="A" required>
                    const
                </label>

                <label>
                    <input type="radio" name="q5" value="B">
                    let
                </label>

                <label>
                    <input type="radio" name="q5" value="C">
                    function
                </label>

                <label>
                    <input type="radio" name="q5" value="D">
                    return
                </label>
            </fieldset>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>

    <script src="script.js"></script>
</body>

</html>
